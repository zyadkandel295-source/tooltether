name: Security
on:
  pull_request:
  schedule:
    - cron: "43 3 * * 2"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: python -m pip install -e ".[dev]"
      - run: pip-audit
      - run: bandit -q -r src
      - uses: gitleaks/gitleaks-action@v2

