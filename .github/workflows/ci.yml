name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.14"}
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python -m pytest --cov=tooltether
      - run: mkdocs build --strict
      - run: bandit -q -r src
      - run: pip-audit
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/validate_package.py
      - run: >
          python scripts/installed_package_smoke.py
          dist/tooltether-0.1.0-py3-none-any.whl
          --examples
          examples/basic_usage.py
          examples/typed_tool.py
          examples/async_usage.py
          examples/execution_policy.py
      - run: python scripts/installed_package_smoke.py dist/tooltether-0.1.0.tar.gz
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
