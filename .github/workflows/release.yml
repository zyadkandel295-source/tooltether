name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=tooltether
      - run: mkdocs build --strict
      - run: bandit -q -r src
      - run: pip-audit
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/validate_package.py
      - run: >
          python scripts/installed_package_smoke.py
          dist/tooltether-0.1.0-py3-none-any.whl
          --examples
          examples/basic_usage.py
          examples/typed_tool.py
          examples/async_usage.py
          examples/execution_policy.py
      - run: python scripts/installed_package_smoke.py dist/tooltether-0.1.0.tar.gz
      - run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: checksums
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            checksums/SHA256SUMS
