name: TestPyPI Release
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies & build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Install package dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Test Suite
        run: python -m pytest --cov=tooltether
      - name: Build Distributions
        run: python -m build
      - name: Validate Package Metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Validate Package Contents
        run: python scripts/validate_package.py
      - name: Smoke Test Wheel
        run: >
          python scripts/installed_package_smoke.py
          dist/tooltether-0.1.0-py3-none-any.whl
          --examples
          examples/basic_usage.py
          examples/typed_tool.py
          examples/async_usage.py
          examples/execution_policy.py
      - name: Smoke Test Sdist
        run: python scripts/installed_package_smoke.py dist/tooltether-0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
  testpypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-packages
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
