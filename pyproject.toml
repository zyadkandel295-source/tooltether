[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tooltether"
version = "0.1.0"
description = "A local-first runtime for defining and executing AI tools consistently across supported frameworks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "ToolTether contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.12,<3"]
keywords = ["ai", "tools", "mcp", "agent", "llm", "runtime", "langchain", "openai", "anthropic", "governance"]

[project.urls]
Homepage = "https://github.com/zyadkandel295-source/tooltether"
Documentation = "https://github.com/zyadkandel295-source/tooltether#readme"
Repository = "https://github.com/zyadkandel295-source/tooltether"
Changelog = "https://github.com/zyadkandel295-source/tooltether/blob/main/CHANGELOG.md"
Issues = "https://github.com/zyadkandel295-source/tooltether/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.25,<2"]
openai = ["openai>=2.8,<3"]
anthropic = ["anthropic>=0.75,<1"]
langchain = ["langchain-core>=1.1,<2"]
crewai = ["crewai>=1.7,<2"]
autogen = ["autogen-core>=0.7,<1"]
smolagents = ["smolagents>=1.24,<2"]
otel = ["opentelemetry-api>=1.38,<2"]
all = [
  "mcp>=1.25,<2", "openai>=2.8,<3", "anthropic>=0.75,<1",
  "langchain-core>=1.1,<2", "crewai>=1.7,<2", "autogen-core>=0.7,<1",
  "smolagents>=1.24,<2", "opentelemetry-api>=1.38,<2",
]
dev = [
  "bandit>=1.8", "build>=1.3", "hypothesis>=6.140", "mkdocs>=1.6",
  "mcp>=1.25,<2", "langchain-core>=1.1,<2",
  "mypy>=1.18", "pip-audit>=2.9", "pytest>=8.4", "pytest-asyncio>=1.2",
  "pytest-cov>=6", "ruff>=0.14", "twine>=6.2",
]

[project.scripts]
tooltether = "tooltether.cli:main"

[project.entry-points."tooltether.tools"]
[project.entry-points."tooltether.adapters"]

[tool.hatch.build.targets.wheel]
packages = ["src/tooltether"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/.github",
  "/.gitignore",
  "/benchmarks",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/docs",
  "/examples",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/mkdocs.yml",
  "/NOTICE",
  "/pyproject.toml",
  "/README.md",
  "/RELEASE_CHECKLIST.md",
  "/ROADMAP.md",
  "/SECURITY.md",
  "/scripts",
  "/src/tooltether",
  "/SUPPORT.md",
  "/tests",
]
exclude = [
  "/dist",
  "/dist/**",
  "/site",
  "/site/**",
  "/.pip-audit-cache",
  "/.pip-audit-cache/**",
  "/.venv",
  "/.venv/**",
  "/.venv-wheel",
  "/.venv-wheel/**",
  "/.venv311",
  "/.venv311/**",
  "/.pytest_tmp*",
  "/.tmp_*",
  "/tmp-gha-*",
  "/python-*.exe",
  "/*.db",
  "/*.html",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest_tmp"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["tooltether"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".pip-audit-cache",
  ".pytest_tmp*",
  ".tmp_*",
  ".tools",
  ".venv",
  ".venv-wheel",
  ".venv311",
  "build",
  "dist",
  "site",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["tooltether"]
